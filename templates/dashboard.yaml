purpose:
  heading: Purpose
  text: |
    This interactive webpage shows the scheduled and actual hours of power outages reported by a sample households in Ukraine each day across 15 different administrative regions (oblasts).
visualised:
  heading: What data is visualised?
  text: | 
    Daily scheduled and actual outage hours for a sample of two consumer sub-queues per region. Consumers in each region in Ukraine are divided into twelve total sub-queues with a roughly equal electricity demand. 
    The scheduled outages provided by the Distribution System Operators (DSOs) indicate which sub-queues will be disonnected and when. The system is intended to impact all consumers equally on a weekly timescale. 
    When necccessary, emergency outages are announced that take priority over scheduled outages, and these are indicated on the map in the left panel.
